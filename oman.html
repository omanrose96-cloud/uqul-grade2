<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رياضيات من عُمان | عقول للصف الثاني</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f8f6;color:#17312b}.p{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:1px solid #d8e4de;background:#fff;border-radius:14px;padding:11px 16px;cursor:pointer;font-weight:700}.hero{margin-top:18px;background:linear-gradient(135deg,#fff,#eaf5ef);border:1px solid #dce8e2;border-radius:30px;padding:30px;box-shadow:0 8px 25px #17312b10;text-align:center}.hero h1{font-size:34px;margin:8px}.hero p{font-size:18px;color:#64756f;max-width:700px;margin:12px auto;line-height:1.8}.path{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}.dot{padding:9px 13px;border-radius:20px;background:#fff;border:1px solid #dce8e2}.adventures{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:20px}.adventure{background:#fff;border:1px solid #dce8e2;border-radius:25px;padding:22px;box-shadow:0 7px 20px #17312b0d;transition:.2s}.adventure:hover{transform:translateY(-2px)}.icon{font-size:42px}.adventure h2{margin:8px 0}.adventure p{color:#64756f;line-height:1.7}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tag{background:#eef6f1;padding:7px 10px;border-radius:10px;font-size:13px}.open{background:#245b48;color:#fff;border:0;border-radius:12px;padding:10px 15px;cursor:pointer;font-weight:700}.locked{opacity:.6}.modal{position:fixed;inset:0;background:#17312b66;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.box{background:#fff;border-radius:25px;max-width:650px;width:100%;padding:25px;box-shadow:0 15px 50px #17312b33}.q{background:#f4f8f5;border-radius:18px;padding:18px;margin:14px 0}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.opt{border:1px solid #cddbd4;background:#fff;border-radius:12px;padding:11px;cursor:pointer}.opt.correct{background:#dff3e7;border-color:#8bc2a2}.opt.wrong{background:#f8e4e0;border-color:#d99a8e}.feedback{font-weight:700;margin-top:10px}.close{float:left}.footer{margin-top:20px;background:#fff;border-radius:20px;padding:18px;text-align:center;color:#64756f}@media(max-width:750px){.adventures{grid-template-columns:1fr}.options{grid-template-columns:1fr}}</style>
<style id="uqul-final-visual">
:root{--uq-ink:#26354a;--uq-muted:#6f7b8c;--uq-bg:#f8f9ff;--uq-card:#ffffff;--uq-mint:#5cc6a5;--uq-sky:#68a9f3;--uq-sun:#ffd66b;--uq-lilac:#a98bea;--uq-coral:#ff8d8d;--uq-border:#e6e8f2;--uq-shadow:0 14px 35px rgba(67,74,105,.10)}
body{background:radial-gradient(circle at 8% 8%,rgba(255,214,107,.20),transparent 22%),radial-gradient(circle at 92% 18%,rgba(104,169,243,.17),transparent 24%),linear-gradient(180deg,#fbfbff 0%,#f5fbfa 100%)!important;color:var(--uq-ink)!important}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;opacity:.55}
body:before{width:180px;height:180px;left:-75px;top:28%;background:rgba(169,139,234,.13);box-shadow:110vw 38vh 0 30px rgba(92,198,165,.10)}
body:after{width:120px;height:120px;right:-45px;top:62%;background:rgba(255,141,141,.11);box-shadow:-100vw -52vh 0 20px rgba(104,169,243,.09)}
.p,.wrap{position:relative}
.top{position:relative}
.brand h1,.brand b{letter-spacing:-.4px}
.hero,.section,.card,.unit,.adventure{box-shadow:var(--uq-shadow)!important;border-color:var(--uq-border)!important}
.btn,.pill,.back{transition:transform .18s,box-shadow .18s,border-color .18s}
.btn:hover,.pill:hover,.back:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(67,74,105,.10);border-color:#cfd5e6}
.site-buddy{position:absolute;top:-8px;left:4px;width:72px;height:72px;border-radius:24px;background:linear-gradient(145deg,#fff,#eef7ff);border:3px solid #fff;box-shadow:0 10px 22px rgba(67,74,105,.12);display:grid;place-items:center;font-size:34px;transform:rotate(-5deg);z-index:2}
.site-buddy:after{content:"✦";position:absolute;right:-8px;top:-10px;font-size:20px;color:#ffd15c;transform:rotate(12deg)}
.site-buddy:before{content:"";position:absolute;bottom:-7px;right:15px;width:14px;height:14px;background:#fff;border-right:2px solid #e6e8f2;border-bottom:2px solid #e6e8f2;transform:rotate(45deg)}
.buddy-label{position:absolute;left:78px;top:15px;white-space:nowrap;background:#fff;border:1px solid #e6e8f2;border-radius:14px;padding:7px 10px;font-size:12px;font-weight:800;color:#667286;box-shadow:0 8px 16px rgba(67,74,105,.08)}
.brand{position:relative}
.brand:after{content:"١ ٢ ٣";display:block;margin-top:5px;font-size:11px;letter-spacing:5px;color:#a98bea;font-weight:900}
.hero h1,.hero h2{color:#26354a}
.start,.open,.primary{background:linear-gradient(135deg,#4fc3a1,#5c9eea)!important;border-color:transparent!important;box-shadow:0 8px 16px rgba(80,164,183,.18)}
.one{background:linear-gradient(135deg,#57c9a5,#70aef4)!important}
.two{background:linear-gradient(135deg,#7e79d8,#8eb5f6)!important}
.item{background:rgba(255,255,255,.25)!important;border:1px solid rgba(255,255,255,.25)}
.bottom span,.dot,.tag{border:1px solid #e3e7f0!important;background:#fff!important;transition:transform .18s,box-shadow .18s}
.bottom span:hover,.dot:hover,.tag:hover{transform:translateY(-2px);box-shadow:0 7px 15px rgba(67,74,105,.08)}
.level{box-shadow:0 8px 18px rgba(67,74,105,.06);border-color:#e6e8f2!important}
.start{border-top-color:#59c6a5!important}.advance{border-top-color:#67a9ef!important}.challenge{border-top-color:#a98bea!important}
.visual-lab{background:linear-gradient(135deg,#ffffff,#f1f8ff)!important;border-color:#e1e6f2!important;box-shadow:inset 0 1px 0 #fff}
.oman{background:linear-gradient(135deg,#fffaf0,#fff5df)!important}.think{background:linear-gradient(135deg,#f9f5ff,#f1edff)!important}.check{background:linear-gradient(135deg,#f2f8ff,#edf7ff)!important}
@media(max-width:750px){.site-buddy{position:relative;top:auto;left:auto;width:58px;height:58px;margin:0 auto 6px;font-size:28px}.buddy-label{left:60px;top:8px}}
</style>
</head><body><div class="site-buddy" aria-hidden="true">🧠<span class="buddy-label">هيا نكتشف! ✨</span></div><div class="p"><header class="top"><button class="btn" onclick="location.href='index.html'">← الرئيسية</button><div><b>🧠 عقول للصف الثاني</b><div style="color:#71817b;margin-top:5px">رحلتي في عالم الرياضيات</div></div><div><button class="btn" onclick="location.href='profile.html'">👤 ملفي</button> <button class="btn" onclick="location.href='progress.html'">⭐ تقدمي</button></div></header><section class="hero"><div style="font-size:44px">🇴🇲</div><h1>رياضيات من عُمان</h1><p>هل تستطيع أن ترى الرياضيات من حولك؟ اكتشف كيف نستخدم الأعداد والقياس والأشكال والوقت والبيانات في حياتنا اليومية في عُمان.</p><div class="path"><span class="dot">🌴 ألاحظ</span><span class="dot">🔎 أكتشف</span><span class="dot">🧠 أفكر</span><span class="dot">⭐ أتحدى</span></div></section><main class="adventures" id="adventures"></main><div class="footer">كلما اكتشفت الرياضيات من حولك، أصبحت رحلتك أوسع 🌟</div></div><div class="modal" id="modal"><div class="box"><button class="btn close" onclick="closeModal()">إغلاق</button><div id="modalContent"></div></div></div><script>
const adventures=[
{key:'palm',icon:'🌴',title:'في مزرعة النخيل',desc:'نكتشف كيف تساعدنا العشرات والعد المتكرر والبيانات في تنظيم ثمار النخيل.',tags:['العشرات','العد','البيانات'],qs:[['في مزرعة ٦ صفوف، في كل صف ١٠ نخلات. كم نخلة؟',['٥٠','٦٠','٧٠'],1],['لدى المزارع ٣٠ صندوق تمر ووضعها في مجموعات من ١٠. كم مجموعة؟',['٣','١٠','٢٠'],0],['أي طريقة تساعدك على عد ٥٠ ثمرة بسرعة؟',['العد واحدًا واحدًا','تجميعها في مجموعات','تجاهل بعضها'],1]]},
{key:'market',icon:'🛍️',title:'في السوق العُماني',desc:'نستخدم الريال العُماني لنحل مواقف الجمع والطرح والمقارنة واتخاذ القرار.',tags:['الريال العُماني','الجمع','الطرح'],qs:[['معك ٥ ريالات، اشتريت شيئًا بريالين. كم بقي؟',['٣','٢','٧'],0],['أي المبلغ أكبر؟',['٣ ريالات','٥ ريالات','٤ ريالات'],1],['ثمن ٣ أشياء: ١ ريال + ٢ ريال + ١ ريال. كم المجموع؟',['٣','٤','٥'],1]]},
{key:'fort',icon:'🏰',title:'في الحصن',desc:'نبحث عن الأشكال الثنائية والمجسمات والتماثل في العمارة من حولنا.',tags:['الأشكال','المجسمات','التماثل'],qs:[['شكل له ٤ أضلاع متساوية هو؟',['مثلث','مربع','دائرة'],1],['أيٌّ مما يأتي مجسم؟',['مربع','مثلث','مكعب'],2],['عندما ينقسم الشكل إلى نصفين متطابقين يسمى ذلك؟',['تماثل','تقدير','قياس'],0]]},
{key:'sea',icon:'🐟',title:'على شاطئ عُمان',desc:'نقيس المسافات ونقدّرها ونقارن النتائج بطريقة عادلة.',tags:['القياس','المسافة','التقدير'],qs:[['لقياس طول طاولة، أيهما أنسب؟',['سنتيمتر','كيلومتر','ساعة'],0],['إذا قطعت سيارة لعبة ٨٠ سم وسيارة أخرى ٥٠ سم، فما الفرق؟',['٢٠ سم','٣٠ سم','٤٠ سم'],1],['قبل القياس، يمكنني أولًا أن…',['أقدّر','أغيّر الوحدة كل مرة','أحذف النتيجة'],0]]},
{key:'weather',icon:'🌦️',title:'طقس عُمان',desc:'نقرأ البيانات ونقارنها ونبحث عن معنى الأرقام بدل الاكتفاء بقراءتها.',tags:['البيانات','المقارنة','الطقس'],qs:[['إذا كانت الحرارة صباحًا ٢٥° ومساءً ٣٠°، أيهما أعلى؟',['الصباح','المساء','متساويتان'],1],['ما الفرق بين ٣٠ و٢٥؟',['٣','٥','١٠'],1],['عند تسجيل درجات الحرارة لعدة أيام، ما الذي يساعدنا على المقارنة؟',['جدول أو مخطط','تخمين فقط','حذف الأرقام'],0]]},
{key:'kitchen',icon:'🍯',title:'في المطبخ العُماني',desc:'نستخدم الكتلة والوقت والقياس أثناء إعداد الطعام والوصفات.',tags:['الكتلة','الوقت','القياس'],qs:[['إذا بدأ الطهي ١٠:٢٠ واستمر ٢٠ دقيقة، ينتهي عند…',['١٠:٣٠','١٠:٤٠','١١:٢٠'],1],['لقياس كتلة مكوّن نستخدم…',['ميزانًا','مسطرة','ساعة'],0],['وصفة تحتاج ٢٠٠ غرام من الدقيق، ولدينا ١٥٠ غرامًا. كم نحتاج؟',['٣٠غ','٥٠غ','١٠٠غ'],1]]}
];
function ar(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function render(){document.getElementById('adventures').innerHTML=adventures.map((a,i)=>{const done=localStorage.getItem('uqul_oman_'+a.key)==='1';return `<article class="adventure"><div class="icon">${a.icon}</div><h2>${a.title}</h2><p>${a.desc}</p><div class="tags">${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><button class="open" onclick="openAdventure(${i})">${done?'✓ أعد المغامرة':'ابدأ المغامرة ←'}</button></article>`}).join('')}
function openAdventure(i){const a=adventures[i];document.getElementById('modalContent').innerHTML=`<div style="font-size:38px">${a.icon}</div><h2>${a.title}</h2><p style="color:#64756f">حل الأسئلة ثم اضغط «أنهيت المغامرة» عندما تنتهي.</p>${a.qs.map((q,qi)=>`<div class="q"><b>${ar(qi+1)}. ${q[0]}</b><div class="options">${q[1].map((o,oi)=>`<button class="opt" onclick="answer(this,${oi},${q[2]},${qi})">${o}</button>`).join('')}</div><div class="feedback" id="fb${qi}"></div></div>`).join('')}<button class="open" onclick="finishAdventure('${a.key}')">⭐ أنهيت المغامرة</button>`;document.getElementById('modal').classList.add('show')}
function answer(btn,chosen,correct,qi){const parent=btn.parentElement;parent.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(chosen===correct){btn.classList.add('correct');document.getElementById('fb'+qi).textContent='أحسنت! إجابة صحيحة ✓';}else{btn.classList.add('wrong');parent.children[correct].classList.add('correct');document.getElementById('fb'+qi).textContent='اقتربت! جرّب التفكير في الطريقة مرة أخرى.';}}
function finishAdventure(key){localStorage.setItem('uqul_oman_'+key,'1');closeModal();render()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
render();
</script></body></html>
