<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفصل الدراسي الأول | عقول للصف الثاني</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8f6;color:#17312b}.p{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.back,.pill{border:1px solid #d9e5df;background:white;border-radius:14px;padding:11px 16px;cursor:pointer}.hero{background:white;border-radius:28px;padding:25px;margin:20px 0;box-shadow:0 8px 24px #17312b10}.progress{height:11px;background:#e6eeea;border-radius:10px;overflow:hidden;margin-top:12px}.fill{height:100%;width:6%;background:#55a67d}.unit{margin:18px 0}.unit-head{display:flex;align-items:center;justify-content:space-between;background:#e9f3ed;padding:15px 20px;border-radius:18px}.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}.lesson{background:white;border:1px solid #e0e9e4;border-radius:20px;padding:19px;min-height:135px;box-shadow:0 5px 16px #17312b08}.lesson h3{margin:0 0 9px}.status{display:inline-block;margin-top:12px;font-size:13px;padding:7px 10px;border-radius:10px;background:#f0f5f2}.open{border:0;background:#245b48;color:white;border-radius:12px;padding:9px 13px;cursor:pointer;margin-top:10px}.soon{opacity:.55}@media(max-width:800px){.lessons{grid-template-columns:1fr 1fr}}@media(max-width:550px){.top{align-items:flex-start}.lessons{grid-template-columns:1fr}}</style>
<style id="uqul-final-visual">
:root{--uq-ink:#26354a;--uq-muted:#6f7b8c;--uq-bg:#f8f9ff;--uq-card:#ffffff;--uq-mint:#5cc6a5;--uq-sky:#68a9f3;--uq-sun:#ffd66b;--uq-lilac:#a98bea;--uq-coral:#ff8d8d;--uq-border:#e6e8f2;--uq-shadow:0 14px 35px rgba(67,74,105,.10)}
body{background:radial-gradient(circle at 8% 8%,rgba(255,214,107,.20),transparent 22%),radial-gradient(circle at 92% 18%,rgba(104,169,243,.17),transparent 24%),linear-gradient(180deg,#fbfbff 0%,#f5fbfa 100%)!important;color:var(--uq-ink)!important}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;opacity:.55}
body:before{width:180px;height:180px;left:-75px;top:28%;background:rgba(169,139,234,.13);box-shadow:110vw 38vh 0 30px rgba(92,198,165,.10)}
body:after{width:120px;height:120px;right:-45px;top:62%;background:rgba(255,141,141,.11);box-shadow:-100vw -52vh 0 20px rgba(104,169,243,.09)}
.p,.wrap{position:relative}
.top{position:relative}
.brand h1,.brand b{letter-spacing:-.4px}
.hero,.section,.card,.unit,.adventure{box-shadow:var(--uq-shadow)!important;border-color:var(--uq-border)!important}
.btn,.pill,.back{transition:transform .18s,box-shadow .18s,border-color .18s}
.btn:hover,.pill:hover,.back:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(67,74,105,.10);border-color:#cfd5e6}
.site-buddy{position:absolute;top:-8px;left:4px;width:72px;height:72px;border-radius:24px;background:linear-gradient(145deg,#fff,#eef7ff);border:3px solid #fff;box-shadow:0 10px 22px rgba(67,74,105,.12);display:grid;place-items:center;font-size:34px;transform:rotate(-5deg);z-index:2}
.site-buddy:after{content:"✦";position:absolute;right:-8px;top:-10px;font-size:20px;color:#ffd15c;transform:rotate(12deg)}
.site-buddy:before{content:"";position:absolute;bottom:-7px;right:15px;width:14px;height:14px;background:#fff;border-right:2px solid #e6e8f2;border-bottom:2px solid #e6e8f2;transform:rotate(45deg)}
.buddy-label{position:absolute;left:78px;top:15px;white-space:nowrap;background:#fff;border:1px solid #e6e8f2;border-radius:14px;padding:7px 10px;font-size:12px;font-weight:800;color:#667286;box-shadow:0 8px 16px rgba(67,74,105,.08)}
.brand{position:relative}
.brand:after{content:"١ ٢ ٣";display:block;margin-top:5px;font-size:11px;letter-spacing:5px;color:#a98bea;font-weight:900}
.hero h1,.hero h2{color:#26354a}
.start,.open,.primary{background:linear-gradient(135deg,#4fc3a1,#5c9eea)!important;border-color:transparent!important;box-shadow:0 8px 16px rgba(80,164,183,.18)}
.one{background:linear-gradient(135deg,#57c9a5,#70aef4)!important}
.two{background:linear-gradient(135deg,#7e79d8,#8eb5f6)!important}
.item{background:rgba(255,255,255,.25)!important;border:1px solid rgba(255,255,255,.25)}
.bottom span,.dot,.tag{border:1px solid #e3e7f0!important;background:#fff!important;transition:transform .18s,box-shadow .18s}
.bottom span:hover,.dot:hover,.tag:hover{transform:translateY(-2px);box-shadow:0 7px 15px rgba(67,74,105,.08)}
.level{box-shadow:0 8px 18px rgba(67,74,105,.06);border-color:#e6e8f2!important}
.start{border-top-color:#59c6a5!important}.advance{border-top-color:#67a9ef!important}.challenge{border-top-color:#a98bea!important}
.visual-lab{background:linear-gradient(135deg,#ffffff,#f1f8ff)!important;border-color:#e1e6f2!important;box-shadow:inset 0 1px 0 #fff}
.oman{background:linear-gradient(135deg,#fffaf0,#fff5df)!important}.think{background:linear-gradient(135deg,#f9f5ff,#f1edff)!important}.check{background:linear-gradient(135deg,#f2f8ff,#edf7ff)!important}
@media(max-width:750px){.site-buddy{position:relative;top:auto;left:auto;width:58px;height:58px;margin:0 auto 6px;font-size:28px}.buddy-label{left:60px;top:8px}}
</style>
</head><body><div class="site-buddy" aria-hidden="true">🧠<span class="buddy-label">هيا نكتشف! ✨</span></div><div class="p"><header class="top"><button class="back" onclick="location.href='index.html'">← الرئيسية</button><div><b>🧠 عقول للصف الثاني</b><div style="color:#71817b;margin-top:5px">رحلتي في عالم الرياضيات</div></div><div><button class="pill" onclick="location.href='profile.html'">👤 ملفي</button> <button class="pill" onclick="location.href='progress.html'">⭐ تقدمي</button> <button class="pill" onclick="location.href='oman.html'">🇴🇲 رياضيات من عُمان</button></div></header><section class="hero"><h1>🌟 رحلتي في الفصل الدراسي الأول</h1><p>اختر وحدتك، ثم انطلق في رحلة اكتشاف الرياضيات!</p><b>تقدمك في الفصل</b><div class="progress"><div class="fill"></div></div><small>١ من ١٧ درسًا رئيسيًا بدأ</small></section><main id="units"></main></div><script>const units=[['١أ','العدد وحل المشكلات',[['١-١ صناعة لوحة المائة','أرتب الأعداد وأكتشف الأنماط في لوحة المائة'],['١-٢ العد بالاثنينات والخمسات والعشرات','أعد مجموعات الأعداد بطرائق مختلفة'],['١-٣ الأزواج العددية حتى ١٠٠','أكتشف الأزواج العددية التي تكوّن ١٠٠'],['٢-٣ جمع وطرح الأزواج العددية حتى ١٠٠','أستخدم الأزواج العددية في الجمع والطرح'],['١-٤ استخدام خط الأعداد','أستخدم خط الأعداد للحل'],['٢-٤ تقريب الأعداد باستخدام خط الأعداد','أقرّب الأعداد باستخدام خط الأعداد'],['١-٥ الأزواج العددية لـ٢٠','أكوّن أزواجًا عددية للعدد ٢٠'],['٢-٥ الأزواج العددية بين ١٠ و٢٠','أحل مسائل بالأزواج العددية'],['١-٦ الجمع باستخدام الأزواج العددية','أجمع باستخدام استراتيجيات مناسبة'],['٢-٦ التحقق من الحل','أتحقق من صحة إجابتي'],['٣-٦ المتساوي والمتكافئ','أميز بين العبارات المتساوية والمتكافئة'],['١-٧ مقدمة حول المصفوفات','أمثل الكميات في صفوف وأعمدة'],['١-٨ الأشكال الثنائية الأبعاد','أتعرف الأشكال وأصف خصائصها'],['٢-٨ المجسمات','أتعرف المجسمات من حولي'],['٣-٨ التماثل','أكتشف التماثل في الأشكال']]],['١ج','القياس وحل المشكلات',[['١-٩ صناعة علبة','أستخدم القياس لصناعة نموذج'],['٢-٩ قياس المسافة','أقيس المسافات بوحدات مناسبة'],['٣-٩ صناعة أجسام متحركة','أطبق القياس في صنع جسم متحرك'],['١-١٠ قياس الوقت','أقرأ الوقت وأستخدمه في مواقف حياتية'],['٢-١٠ قياس المسافة','أحل مسائل تتعلق بالمسافة'],['٣-١٠ قياس الارتفاع','أقيس الارتفاع وأقارنه'],['١-١١ قياس المكونات','أستخدم القياس في إعداد المكونات'],['٢-١١ وقت الطهي','أربط الوقت بمواقف حياتية'],['٣-١١ البسكويت الثمين','أحل مشكلة مرتبطة بالإنفاق والقياس']]],['٢أ','الأعداد والأنماط والجمع والطرح',[['١-١٢ العشرات والآحاد حتى ١٠٠','أمثل الأعداد بالعشرات والآحاد'],['٢-١٢ مقارنة وترتيب الأعداد','أقارن الأعداد وأرتبها'],['١-١٣ التقدير','أقدّر الكميات والأعداد'],['١-١٤ الأزواج العددية لـ٢٠','أكتشف الأزواج العددية للعدد ٢٠'],['٢-١٤ الضعف','أستخدم مفهوم الضعف'],['٣-١٤ تصنيف الأعداد','أصنف الأعداد وفق خصائصها'],['١-١٥ الأعداد المكونة من رقم أو رقمين','أمثل الأعداد وأقرأها'],['٢-١٥ الأعداد المكونة من رقمين','أحل مسائل بالأعداد ذات الرقمين'],['١-١٦ العثور على الفرق','أجد الفرق بين كميتين'],['١-١٧ المصفوفات','أمثل المجموعات بالمصفوفات'],['٢-١٧ العد بالاثنينات والخمسات والعشرات','أستخدم العد المتكرر'],['٣-١٧ القسمة','أشارك الكميات بالتساوي']]]];function ar(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
const root=document.getElementById('units');
function lessonStatus(t){if(localStorage.getItem('uqul_completed_'+t)==='1')return '🟢 مكتمل'; if(Number(localStorage.getItem('uqul_'+t))>0)return '🔵 قيد التعلم'; return '⚪ لم يبدأ'}
const allLessons=units.flatMap(u=>u[2]);
const doneCount=allLessons.filter(x=>localStorage.getItem('uqul_completed_'+x[0])==='1').length;
const startedCount=allLessons.filter(x=>Number(localStorage.getItem('uqul_'+x[0]))>0).length;
const pct=allLessons.length?Math.round(doneCount/allLessons.length*100):0;
const fill=document.querySelector('.fill');if(fill)fill.style.width=pct+'%';
const heroSmall=document.querySelector('.hero small');if(heroSmall)heroSmall.textContent=doneCount?`${ar(doneCount)} من ${ar(allLessons.length)} درسًا مكتملًا • ${ar(pct)}٪`:startedCount?`${ar(startedCount)} درسًا قيد التعلم`: 'ابدأ أول درس في رحلتك.';
root.innerHTML=units.map(u=>`<section class="unit"><div class="unit-head"><div><b>${u[0]}</b> — ${u[1]}</div><span>📚 ${u[2].length} دروس</span></div><div class="lessons">${u[2].map((l,i)=>`<article class="lesson"><h3>${l[0]}</h3><div>${l[1]}</div><span class="status">${lessonStatus(l[0])}</span><br><button class="open" onclick="location.href='lesson.html?lesson='+encodeURIComponent('${l[0]}')">افتح الدرس ←</button></article>`).join('')}</div></section>`).join('');

</script></body></html>
