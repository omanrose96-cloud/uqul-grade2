'٢-٩ قياس المسافة':{icon:'📏',intro:'أي سيارة ستصل أبعد؟ لا نتوقع فقط... بل نقيس ونقارن ونجعل التجربة عادلة! 🚗',goals:['أقدّر أي مسافة ستكون أطول قبل القياس','أقيس المسافات باستخدام وحدات وأدوات مناسبة','أقارن النتائج وأشرح كيف أجعل التجربة عادلة'],learn:'عندما نريد مقارنة المسافات، لا يكفي أن ننظر فقط. نحتاج إلى قياسها بطريقة عادلة. إذا كانت السيارات تنطلق من المنحدر نفسه وتتحرر دون دفع، نستطيع مقارنة المسافات التي قطعتها ثم تسجيل النتائج.',example:'إذا قطعت السيارة الأولى ٨٠ سم والثانية ٥٥ سم، فالسيارة الأولى قطعت مسافة أبعد بمقدار ٢٥ سم.',visual:'distanceMeasure',start:[['قطعت سيارة ٦٠ سم وأخرى ٤٠ سم. أيهما قطعت مسافة أبعد؟',['السيارة الأولى','السيارة الثانية','المسافتان متساويتان'],0],['أي أداة أنسب لقياس مسافة قطعتها سيارة على الأرض؟',['مسطرة أو شريط قياس','ميزان','ساعة'],0],['إذا قطعت سيارة ٣٥ سم ثم ٢٠ سم أخرى، فأي مسافة أكبر؟',['٣٥ سم','٢٠ سم','متساويتان'],0]],advance:[['سيارة أ قطعت ٧٠ سم، وسيارة ب قطعت ٧٥ سم. كم تزيد مسافة ب؟',['٥ سم','١٠ سم','١٥ سم'],0],['قست مجموعة مسافة باستخدام مشابك ورق، ومجموعة أخرى باستخدام السنتيمتر. لماذا لا نقارن العددين مباشرة؟',['لأن وحدتي القياس مختلفتان','لأن القياس غير مهم','لأن السيارة يجب أن تكون أكبر'],0],['أي تجربة أكثر عدلًا لمقارنة سيارتين؟',['نطلقهما من المنحدر نفسه دون دفع','يدفع كل طالب سيارته بقوة مختلفة','نبدأ كل سيارة من مكان مختلف'],0]],challenge:[['توقعت مريم أن سيارتها ستقطع أبعد مسافة، لكنها قطعت ٦٥ سم بينما قطعت سيارة سالم ٨٠ سم. ماذا نستنتج؟',['تقدير مريم لم يطابق النتيجة','سيارة مريم قطعت أبعد','لا يمكن مقارنة المسافتين'],0],['غيّرنا ارتفاع المنحدر من ٢٠ سم إلى ٣٠ سم. ما السؤال الأفضل للتحقق من أثر ذلك؟',['هل تقطع السيارة مسافة أبعد؟','ما لون السيارة؟','كم عدد عجلات السيارة؟'],0],['سيارة أ قطعت ٩٠ سم، وب قطعت ٧٠ سم، وج قطعت ٨٥ سم. رتّبها من الأبعد إلى الأقرب.',['أ، ج، ب','ب، ج، أ','ج، أ، ب'],0]],think:[['لماذا نستخدم المنحدر نفسه عند مقارنة السيارات؟',['حتى تكون بداية التجربة متشابهة ونقارن المسافة بعدل','حتى تتحرك السيارات أسرع دائمًا'],0],['أي أفضل: أن أقول «هذه السيارة تبدو أبعد» أم أقيس المسافة؟ ولماذا؟' if(d.visual==='equalBalance'){document.getElementById('visual').innerHTML=`<div class="info" style="margin-top:15px;text-align:center"><b style="font-size:21px">⚖️ ميزان التساوي</b><p>الطرفان متكافئان عندما تكون لهما <b>القيمة نفسها</b>، حتى لو كانت الأعداد مختلفة.</p><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px 0"><span class="badge">٥ + ١٢ = ١٧</span><span style="font-size:28px">⚖️</span><span class="badge">٣ + ١٤ = ١٧</span></div><p style="font-size:20px;font-weight:800">٥ + ١٢ = ٣ + ١٤ ✓</p><p class="hint">💡 لا تبحث عن الشكل نفسه؛ ابحث عن القيمة نفسها.</p></div>`}
if(d.visual==='solids3d'){const card=(emoji,label,desc)=>`<div class="info" style="text-align:center;min-width:150px;flex:1"><div style="font-size:58px;line-height:1.1">${emoji}</div><b style="font-size:18px">${label}</b><p style="margin:7px 0;font-size:15px">${desc}</p></div>`;document.getElementById('visual').innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px">${card('🧊','مكعب','٦ أوجه مربعة')}${card('📦','متوازي المستطيلات','أوجه مستطيلة')}${card('🥫','أسطوانة','قاعدتان دائريتان')}${card('🍦','مخروط','قاعدة دائرية ورأس واحد')}${card('⚽','كرة','سطح منحني ولا رؤوس')}${card('🔺','هرم','قاعدة وأوجه مثلثة تلتقي في رأس')}</div><div class="info" style="margin-top:15px;text-align:center"><b style="font-size:21px">💡 الشكل المسطّح أم المجسم؟</b><p>المثلث والمربع شكلان ثنائيان الأبعاد، أما المكعب والكرة والأسطوانة فهي مجسمات لها <b>طول وعرض وارتفاع</b>.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><span class="badge">مسطح: 🔺 مثلث</span><span class="badge">مجسم: 🧊 مكعب</span><span class="badge">مجسم: ⚽ كرة</span></div></div>`} 
if(d.visual==='symmetry'){const symShape=(type,label)=>{let svg='';if(type==='square')svg='<svg viewBox="0 0 140 120" width=140 height=120><rect x=25 y=15 width=90 height=90 fill="#eaf5ef" stroke="#4f7f6a" stroke-width=4/><line x1=70 y1=5 x2=70 y2=115 stroke="#bd8a32" stroke-width=3 stroke-dasharray="7 5"/></svg>';if(type==='butterfly')svg='<svg viewBox="0 0 160 120" width=160 height=120><path d="M80 58 C55 15 15 20 28 55 C35 72 55 75 76 68 C60 92 35 100 45 110 C61 116 73 91 80 73 C87 91 99 116 115 110 C125 100 100 92 84 68 C105 75 125 72 132 55 C145 20 105 15 80 58Z" fill="#eaf5ef" stroke="#4f7f6a" stroke-width=3/><line x1=80 y1=8 x2=80 y2=112 stroke="#bd8a32" stroke-width=3 stroke-dasharray="7 5"/></svg>';if(type==='heart')svg='<svg viewBox="0 0 140 120" width=140 height=120><path d="M70 105 L18 55 C-2 25 35 5 70 35 C105 5 142 25 122 55 Z" fill="#eaf5ef" stroke="#4f7f6a" stroke-width=4/><line x1=70 y1=10 x2=70 y2=112 stroke="#bd8a32" stroke-width=3 stroke-dasharray="7 5"/></svg>';return `<div class="info" style="text-align:center;min-width:170px">${svg}<b>${label}</b></div>`};document.getElementById('visual').innerHTML=`<div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:15px">${symShape('square','المربع: خطوط تماثل واضحة')}${symShape('butterfly','الفراشة: انعكاس يمين/يسار')}${symShape('heart','القلب: نصف يعكس النصف الآخر')}</div><div class="info" style="margin-top:15px;text-align:center"><b>🪞 تجربة الطي</b><p>تخيل أنك تطوي الشكل على الخط المتقطع. إذا تطابق النصفان، فلدينا <b>تماثل انعكاسي</b>.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><span class="badge">خط التماثل = خط الطي</span><span class="badge">النصفان متطابقان</span></div></div>`}
if(d.visual==='shapes2d'){const shape=(type,label)=>{let svg='';if(type==='triangle')svg='<svg viewBox="0 0 120 100" width=120 height=100><polygon points="60,10 105,85 15,85" fill="#eaf5ef" stroke="#4f7f6a" stroke-width="4"/></svg>';if(type==='square')svg='<svg viewBox="0 0 120 100" width=120 height=100><rect x="25" y="10" width="70" height="70" fill="#eaf5ef" stroke="#4f7f6a" stroke-width="4"/></svg>';if(type==='rect')svg='<svg viewBox="0 0 120 100" width=120 height=100><rect x="12" y="25" width="96" height="50" fill="#eaf5ef" stroke="#4f7f6a" stroke-width="4"/></svg>';if(type==='pent')svg='<svg viewBox="0 0 120 100" width=120 height=100><polygon points="60,8 105,40 88,90 32,90 15,40" fill="#eaf5ef" stroke="#4f7f6a" stroke-width="4"/></svg>';if(type==='hex')svg='<svg viewBox="0 0 120 100" width=120 height=100><polygon points="30,10 90,10 110,50 90,90 30,90 10,50" fill="#eaf5ef" stroke="#4f7f6a" stroke-width="4"/></svg>';if(type==='circle')svg='<svg viewBox="0 0 120 100" width=120 height=100><circle cx="60" cy="50" r="35" fill="#eaf5ef" stroke="#4f7f6a" stroke-width="4"/></svg>';return `<div class="info" style="text-align:center;min-width:130px">${svg}<b>${label}</b></div>`};document.getElementById('visual').innerHTML=`<div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px">${shape('triangle','مثلث: ٣ أضلاع')}${shape('square','مربع: ٤ أضلاع')}${shape('rect','مستطيل: ٤ أضلاع')}${shape('pent','خماسي: ٥ أضلاع')}${shape('hex','سداسي: ٦ أضلاع')}${shape('circle','دائرة: لا أضلاع مستقيمة')}</div><div class="info" style="margin-top:15px;text-align:center"><b>💡 سرّ الأشكال</b><p>لا تنظر إلى اتجاه الشكل فقط؛ ابحث عن <b>عدد الأضلاع والزوايا</b> وخصائصه.</p><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><span class="badge">مثلث → ٣ أضلاع</span><span class="badge">مربع → ٤ أضلاع</span><span class="badge">خماسي → ٥ أضلاع</span><span class="badge">سداسي → ٦ أضلاع</span></div></div>`} 
if(d.visual==='boxMeasure'){document.getElementById('visual').innerHTML=`<div class="info" style="margin-top:15px;text-align:center"><b style="font-size:21px">📦 صمّم علبة مناسبة</b><p>فكّر في عدد المكعبات ثم رتّبها في صفوف وأعمدة.</p><div style="display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin:18px 0"><div><div style="font-weight:800;margin-bottom:8px">٤ × ٥ = ٢٠</div><div style="display:grid;grid-template-columns:repeat(5,30px);gap:5px;justify-content:center">${Array(20).fill(0).map(()=>'<span style=\"width:30px;height:30px;border:2px solid #7fa896;border-radius:5px;background:#eaf5ef;display:block\"></span>').join('')}</div></div><div style="font-size:32px">↔️</div><div><div style="font-weight:800;margin-bottom:8px">٥ × ٤ = ٢٠</div><div style="display:grid;grid-template-columns:repeat(4,30px);gap:5px;justify-content:center">${Array(20).fill(0).map(()=>'<span style=\"width:30px;height:30px;border:2px solid #7fa896;border-radius:5px;background:#eaf5ef;display:block\"></span>').join('')}</div></div></div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><span class="badge">عدد المكعبات = ٢٠</span><span class="badge">التصميمان مختلفان لكن العدد نفسه</span></div><p class="hint">💡 العلبة الجيدة تناسب ما نريد وضعه فيها: ليست ضيقة جدًا ولا واسعة بلا حاجة.</p></div>`}
if(d.visual==='arrayIntro'){const dots=(rows,cols)=>Array.from({length:rows},()=>`<div class="array-grid" style="grid-template-columns:repeat(${cols},32px)">${Array(cols).fill(0).map(()=>'<span class="array-dot"></span>').join('')}</div>`).join('');document.getElementById('visual').innerHTML=`<div class="visual-lab"><div class="lab-title">🔳 مختبر المصفوفات</div><p class="lab-sub">انظر إلى العدد نفسه من العناصر مرتبة بطريقتين مختلفتين.</p><div class="array-board"><div class="array-card"><b>٢ صفوف × ٥</b>${dots(2,5)}<span class="badge">٥ + ٥ = ١٠</span></div><div class="arrow-big">↔️</div><div class="array-card"><b>٥ صفوف × ٢</b>${dots(5,2)}<span class="badge">٢ + ٢ + ٢ + ٢ + ٢ = ١٠</span></div></div><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap"><button class="mini-btn active" onclick="arrayExplain(0,this)">👀 أرى الصفوف</button><button class="mini-btn" onclick="arrayExplain(1,this)">↕️ أرى الأعمدة</button></div><div id="arrayExplain" class="badge" style="margin-top:14px">الصف أفقي، والعمود رأسي.</div><p class="hint">💡 المصفوفة تساعدني على الانتقال من الجمع المتكرر إلى الضرب.</p></div>`;window.arrayExplain=function(mode,btn){document.querySelectorAll('.visual-lab .mini-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('arrayExplain').textContent=mode===0?'الصف أفقي: ٥ + ٥ = ١٠.':'العمود رأسي: ٢ + ٢ + ٢ + ٢ + ٢ = ١٠.'}}

if(d.visual==='pairsBetween20'){document.getElementById('visual').innerHTML=`<div class="info" style="margin-top:15px;text-align:center"><b style="font-size:21px">🧩 إطار العشرة واكتشاف الأزواج</b><p>ابدأ بعدد، ثم أضف شريكًا حتى يصبح المجموع بين <b>١٠ و٢٠</b>.</p><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0"><span class="badge">٦ + ٥ = ١١</span><span class="badge">٧ + ٩ = ١٦</span><span class="badge">٨ + ٧ = ١٥</span><span class="badge">٩ + ١٠ = ١٩</span></div><div style="max-width:720px;margin:12px auto;background:#fff;border:1px dashed #9ab7aa;border-radius:16px;padding:14px"><b>🔺 مثال لعائلة حقائق</b><p style="font-size:20px;font-weight:800">٦ + ٨ = ١٤ &nbsp; | &nbsp; ٨ + ٦ = ١٤</p><p style="font-size:20px;font-weight:800">١٤ - ٦ = ٨ &nbsp; | &nbsp; ١٤ - ٨ = ٦</p></div><p class="hint">💡 تذكّر: في الطرح نبدأ من المجموع الأكبر.</p></div>`}
if(d.visual==='addPairs10'){document.getElementById('visual').innerHTML=`<div class="info" style="margin-top:15px;text-align:center"><b style="font-size:21px">➕ ابحث عن زوج يصنع ١٠</b><p>رتّب الأعداد في ذهنك، وابحث عن زوج عددي مجموعُه <b>١٠</b>، ثم أكمل الجمع.</p><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0"><span class="badge">٣ + ٧ = ١٠</span><span class="badge">٤ + ٦ = ١٠</span><span class="badge">٢ + ٨ = ١٠</span><span class="badge">٥ + ٥ = ١٠</span></div><div style="max-width:720px;margin:12px auto;background:#fff;border:1px dashed #9ab7aa;border-radius:16px;padding:14px"><b>💡 مثال</b><p style="font-size:20px;font-weight:800">٣ + ٧ + ٥ + ٢</p><p style="font-size:20px;font-weight:800">(٣ + ٧) + ٥ + ٢ = ١٠ + ٥ + ٢ = ١٧</p></div><p class="hint">ابحث أولًا عن زوج يجعل ١٠، ثم اجمع ما تبقى.</p></div>`}
if(d.visual==='pairs20'){document.getElementById('visual').innerHTML=`<div class="info" style="margin-top:15px;text-align:center"><b style="font-size:21px">🧩 إطارا العشرة</b><p>نملأ إطارين ليصبح لدينا <b>٢٠</b>، ثم نكتشف شريك كل عدد.</p><div style="display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:15px 0"><div><div style="display:grid;grid-template-columns:repeat(5,28px);gap:4px;justify-content:center">${Array(10).fill(0).map(()=>'<span style=\"width:28px;height:28px;border:1px solid #9ab7aa;border-radius:5px;background:#eaf5ef\"></span>').join('')}</div><small>١٠</small></div><div><div style="display:grid;grid-template-columns:repeat(5,28px);gap:4px;justify-content:center">${Array(10).fill(0).map(()=>'<span style=\"width:28px;height:28px;border:1px solid #9ab7aa;border-radius:5px;background:#eaf5ef\"></span>').join('')}</div><small>١٠</small></div></div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><span class="badge">٣ + ١٧ = ٢٠</span><span class="badge">٧ + ١٣ = ٢٠</span><span class="badge">١٠ + ١٠ = ٢٠</span></div><p class="hint">💡 اسأل نفسك: «كم أحتاج لأصل إلى ٢٠؟»</p></div>`}
if(d.visual==='counting'){document.getElementById('visual').innerHTML='<div class="visual-lab"><div class="lab-title">🦘 مختبر القفزات</div><p class="lab-sub">اختر نوع القفزة، ثم اضغط «اقفز» لترى السلسلة تتحرك خطوة بخطوة.</p><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap"><button class="mini-btn active" id="jump2" onclick="setJump(2)">➕٢</button><button class="mini-btn" id="jump5" onclick="setJump(5)">➕٥</button><button class="mini-btn" id="jump10" onclick="setJump(10)">➕١٠</button></div><div class="jump-track" id="jumpTrack"></div><button class="mini-btn" onclick="nextJump()">🦘 اقفز</button><div id="jumpHint" class="badge" style="margin-top:14px">ابدأ بالقفز.</div></div>';let jump=2,step=0;const ar=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];function toAr(n){return String(n).split('').map(x=>ar[Number(x)]||x).join('')}function drawJump(){const vals=Array.from({length:6},(_,i)=>jump*(i+1));document.getElementById('jumpTrack').innerHTML=vals.map((v,i)=>(i?'→':'')+'<span class="jump-node '+(i===step?'focus':'')+'">'+toAr(v)+'</span>').join('');document.getElementById('jumpHint').textContent='قفزة مقدارها '+toAr(jump)+'. '+(step?'وصلنا إلى '+toAr(vals[step])+'.':'اضغط «اقفز» لنبدأ.')}window.setJump=function(n){jump=n;step=0;document.querySelectorAll('.visual-lab .mini-btn').forEach(x=>x.classList.remove('active'));document.getElementById('jump'+n).classList.add('active');drawJump()};window.nextJump=function(){step=(step+1)%6;drawJump()};drawJump()}

if(d.visual==='numberline'){const ticks=Array.from({length:11},(_,i)=>'<div style="position:absolute;top:10px;left:'+i*10+'%;transform:translateX(-50%);text-align:center"><div style="height:32px;width:3px;background:#5d7069;margin:auto"></div><b>'+i*10+'</b></div>').join('');document.getElementById('visual').innerHTML='<div class="info" style="margin-top:15px;text-align:center"><b style="font-size:21px">📍 خط الأعداد</b><p>اختر عددًا من الخط، ثم فكر: بين أي عشرَتين يقع؟</p><div style="position:relative;margin:28px 10px 10px;height:64px"><div style="position:absolute;top:24px;left:0;right:0;height:4px;background:#5d7069;border-radius:5px"></div>'+ticks+'</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><span class="badge">٣٠ ← ٣٧ ← ٤٠</span><span class="badge">٦٠ ← ٦٤ ← ٧٠</span><span class="badge">٨٠ ← ٨٢ ← ٩٠</span></div><p class="hint">💡 العشرات تحدد المنطقة، والآحاد تساعدنا على تحديد المكان بدقة.</p></div>'}

if(d.visual==='countingLab'){document.getElementById('visual').innerHTML=`<div class="info" style="margin-top:15px;text-align:center"><div style="font-size:24px;font-weight:800">🔢 مختبر العد السريع</div><p>اختر القفزة المناسبة ثم تتبع القفزات حتى تصل إلى العدد الكلي.</p><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0"><span class="badge">٢ات: ٢، ٤، ٦، ٨، ١٠</span><span class="badge">٥ات: ٥، ١٠، ١٥، ٢٠</span><span class="badge">١٠ات: ١٠، ٢٠، ٣٠، ٤٠</span></div><div style="font-size:20px;font-weight:800;margin-top:12px">🐟 ٦ سلال × ٥ أسماك</div><div style="font-size:24px;font-weight:900;margin:10px">٥ → ١٠ → ١٥ → ٢٠ → ٢٥ → ٣٠</div><p class="hint">💡 عندما تكون الكميات في مجموعات متساوية، اجعل كل قفزة تمثل حجم المجموعة.</p></div>`} 
if(d.visual==='chart'){const nums=Array.from({length:100},(_,i)=>String(i+1).replace(/0/g,'٠').replace(/1/g,'١').replace(/2/g,'٢').replace(/3/g,'٣').replace(/4/g,'٤').replace(/5/g,'٥').replace(/6/g,'٦').replace(/7/g,'٧').replace(/8/g,'٨').replace(/9/g,'٩'));document.getElementById('visual').innerHTML=`<div class="visual-lab"><div class="lab-title">🔢 مختبر لوحة المائة</div><p class="lab-sub">اختر عددًا، ثم اكتشف العدد الذي يبعد عنه ١٠.</p><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap"><button class="mini-btn" onclick="chartMode('ten')">↕️ أظهر قفزات ١٠</button><button class="mini-btn" onclick="chartMode('reset')">↺ إعادة اللوحة</button></div><div class="chart-pro" id="chartPro">${nums.map((n,i)=>`<div class="num ${((i+1)%10===0)?'ten':''}" data-n="${i+1}" onclick="chartPick(this)">${n}</div>`).join('')}</div><div id="chartHint" class="badge">💡 اختر عددًا من اللوحة.</div></div>`;window.chartPick=function(el){document.querySelectorAll('#chartPro .num').forEach(x=>x.classList.remove('focus'));el.classList.add('focus');const n=Number(el.dataset.n);const below=document.querySelector('#chartPro .num[data-n="'+(n+10)+'"]');document.getElementById('chartHint').textContent=below?`⬇️ العدد أسفل ${el.textContent} هو ${below.textContent}. أضف ١٠.`:`⭐ لا يوجد عدد أسفل ${el.textContent}.`};window.chartMode=function(mode){document.querySelectorAll('#chartPro .num').forEach(x=>x.classList.remove('focus'));if(mode==='ten'){document.querySelectorAll('#chartPro .num').forEach(x=>{const n=Number(x.dataset.n);if(n<=90&&n%10===1)x.classList.add('focus')});document.getElementById('chartHint').textContent='↕️ بداية كل صف تساعدك على رؤية القفزة بمقدار ١٠.'}else document.getElementById('chartHint').textContent='💡 اختر عددًا من اللوحة.'}}

const blocks=['start','advance','challenge','think','oman','check'];
let total=0;
const stateKey=(id)=>'uqul_q_'+title+'_'+id;
function render(block,prefix){
  const el=document.getElementById(block); const questions=d[block]||[];
  el.innerHTML=questions.map((q,i)=>{
    total++;
    const id=prefix+i, done=localStorage.getItem(stateKey(id))==='1';
    return `<div class="question"><b>${q[0]}</b><div>${q[1].map((o,j)=>`<button class="opt" ${done?'disabled':''} onclick="answer(this,${j===q[2]},'${id}')">${o}</button>`).join('')}</div><div class="feedback" id="${id}">${done?'رائع! إجابة صحيحة 🌟':''}</div></div>`;
  }).join('');
}
blocks.forEach((b)=>render(b,b[0]));
if(localStorage.getItem('uqul_completed_'+title)==='1'){
  document.querySelectorAll('.question').forEach(q=>q.querySelectorAll('.opt').forEach(b=>b.disabled=true));
}
function scoreNow(){let n=0;blocks.forEach(b=>{(d[b]||[]).forEach((_,i)=>{if(localStorage.getItem(stateKey(b[0]+i))==='1')n++})});return n}
function answer(btn,ok,id){
  const q=btn.parentElement;
  q.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  btn.classList.add(ok?'correct':'wrong');
  const fb=document.getElementById(id);
  fb.textContent=ok?'رائع! إجابة صحيحة 🌟':'ليست الإجابة الصحيحة. حاول مرة أخرى بعد إعادة التدريب 💪';
  if(ok){localStorage.setItem(stateKey(id),'1');update();}
}
function update(){
  const score=scoreNow(), p=total?Math.round(score/total*100):0;
  document.getElementById('fill').style.width=p+'%';
  document.getElementById('progressText').textContent=`أنجزت ${score} من ${total} تدريبات (${p}٪).`;
  document.getElementById('badge').textContent=p===100?'🏆 خبير الرياضيات':p>=70?'⭐ متقدم في الرحلة':'🏅 مستكشف الرياضيات';
  localStorage.setItem('uqul_'+title,score);localStorage.setItem('uqul_total_'+title,total);
  if(p===100){localStorage.setItem('uqul_completed_'+title,'1');document.getElementById('progressText').textContent=`🎉 أحسنت! أكملت درس «${title}» بالكامل. هذا الإنجاز سُجل في رحلتك ⭐`;}
}
update();

</script></body></html>
