<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملفي | عقول للصف الثاني</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f8f6;color:#17312b}.p{max-width:1000px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:1px solid #d9e5df;background:#fff;border-radius:14px;padding:11px 16px;cursor:pointer;font-weight:700}.hero,.card{background:#fff;border:1px solid #dce8e2;border-radius:26px;padding:25px;margin-top:18px;box-shadow:0 8px 24px #17312b10}.hero{background:linear-gradient(135deg,#fff,#eaf5ef)}h1{margin:8px 0}.avatar{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:#e7f3ec;font-size:45px;margin:auto}.namebox{display:flex;gap:10px;max-width:600px;margin:18px auto}.namebox input{flex:1;border:1px solid #ccdcd4;border-radius:14px;padding:13px;font-size:18px}.primary{background:#245b48;color:#fff;border-color:#245b48}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f1f7f3;border-radius:18px;padding:18px;text-align:center}.stat b{display:block;font-size:28px;margin-bottom:6px}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.badge{padding:18px;border-radius:18px;background:#fff8df;border:1px solid #ead9a2;text-align:center;font-weight:800}.muted{color:#71817b}.progress{height:13px;background:#e4ede8;border-radius:20px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#55a67d;width:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:650px){.stats,.badges{grid-template-columns:1fr}.namebox{flex-direction:column}}
</style>
<style id="uqul-final-visual">
:root{--uq-ink:#26354a;--uq-muted:#6f7b8c;--uq-bg:#f8f9ff;--uq-card:#ffffff;--uq-mint:#5cc6a5;--uq-sky:#68a9f3;--uq-sun:#ffd66b;--uq-lilac:#a98bea;--uq-coral:#ff8d8d;--uq-border:#e6e8f2;--uq-shadow:0 14px 35px rgba(67,74,105,.10)}
body{background:radial-gradient(circle at 8% 8%,rgba(255,214,107,.20),transparent 22%),radial-gradient(circle at 92% 18%,rgba(104,169,243,.17),transparent 24%),linear-gradient(180deg,#fbfbff 0%,#f5fbfa 100%)!important;color:var(--uq-ink)!important}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;opacity:.55}
body:before{width:180px;height:180px;left:-75px;top:28%;background:rgba(169,139,234,.13);box-shadow:110vw 38vh 0 30px rgba(92,198,165,.10)}
body:after{width:120px;height:120px;right:-45px;top:62%;background:rgba(255,141,141,.11);box-shadow:-100vw -52vh 0 20px rgba(104,169,243,.09)}
.p,.wrap{position:relative}
.top{position:relative}
.brand h1,.brand b{letter-spacing:-.4px}
.hero,.section,.card,.unit,.adventure{box-shadow:var(--uq-shadow)!important;border-color:var(--uq-border)!important}
.btn,.pill,.back{transition:transform .18s,box-shadow .18s,border-color .18s}
.btn:hover,.pill:hover,.back:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(67,74,105,.10);border-color:#cfd5e6}
.site-buddy{position:absolute;top:-8px;left:4px;width:72px;height:72px;border-radius:24px;background:linear-gradient(145deg,#fff,#eef7ff);border:3px solid #fff;box-shadow:0 10px 22px rgba(67,74,105,.12);display:grid;place-items:center;font-size:34px;transform:rotate(-5deg);z-index:2}
.site-buddy:after{content:"✦";position:absolute;right:-8px;top:-10px;font-size:20px;color:#ffd15c;transform:rotate(12deg)}
.site-buddy:before{content:"";position:absolute;bottom:-7px;right:15px;width:14px;height:14px;background:#fff;border-right:2px solid #e6e8f2;border-bottom:2px solid #e6e8f2;transform:rotate(45deg)}
.buddy-label{position:absolute;left:78px;top:15px;white-space:nowrap;background:#fff;border:1px solid #e6e8f2;border-radius:14px;padding:7px 10px;font-size:12px;font-weight:800;color:#667286;box-shadow:0 8px 16px rgba(67,74,105,.08)}
.brand{position:relative}
.brand:after{content:"١ ٢ ٣";display:block;margin-top:5px;font-size:11px;letter-spacing:5px;color:#a98bea;font-weight:900}
.hero h1,.hero h2{color:#26354a}
.start,.open,.primary{background:linear-gradient(135deg,#4fc3a1,#5c9eea)!important;border-color:transparent!important;box-shadow:0 8px 16px rgba(80,164,183,.18)}
.one{background:linear-gradient(135deg,#57c9a5,#70aef4)!important}
.two{background:linear-gradient(135deg,#7e79d8,#8eb5f6)!important}
.item{background:rgba(255,255,255,.25)!important;border:1px solid rgba(255,255,255,.25)}
.bottom span,.dot,.tag{border:1px solid #e3e7f0!important;background:#fff!important;transition:transform .18s,box-shadow .18s}
.bottom span:hover,.dot:hover,.tag:hover{transform:translateY(-2px);box-shadow:0 7px 15px rgba(67,74,105,.08)}
.level{box-shadow:0 8px 18px rgba(67,74,105,.06);border-color:#e6e8f2!important}
.start{border-top-color:#59c6a5!important}.advance{border-top-color:#67a9ef!important}.challenge{border-top-color:#a98bea!important}
.visual-lab{background:linear-gradient(135deg,#ffffff,#f1f8ff)!important;border-color:#e1e6f2!important;box-shadow:inset 0 1px 0 #fff}
.oman{background:linear-gradient(135deg,#fffaf0,#fff5df)!important}.think{background:linear-gradient(135deg,#f9f5ff,#f1edff)!important}.check{background:linear-gradient(135deg,#f2f8ff,#edf7ff)!important}
@media(max-width:750px){.site-buddy{position:relative;top:auto;left:auto;width:58px;height:58px;margin:0 auto 6px;font-size:28px}.buddy-label{left:60px;top:8px}}
</style>
</head><body><div class="site-buddy" aria-hidden="true">🧠<span class="buddy-label">هيا نكتشف! ✨</span></div><div class="p"><header class="top"><button class="btn" onclick="location.href='index.html'">← الرئيسية</button><b>🧠 عقول للصف الثاني</b><button class="btn" onclick="location.href='progress.html'">⭐ تقدمي</button></header><section class="hero"><div class="avatar">🧒</div><div style="text-align:center"><h1>👤 ملفي</h1><p class="muted">هذا ملفك الشخصي في رحلتك الرياضية.</p></div><div class="namebox"><input id="name" placeholder="اكتب اسمك هنا" maxlength="30"><button class="btn primary" onclick="saveName()">حفظ الاسم</button></div><h2 id="hello" style="text-align:center"></h2></section><section class="card"><h2>⭐ رحلتي في الرياضيات</h2><div class="progress"><div class="fill" id="fill"></div></div><p id="progressText" class="muted"></p><div class="stats"><div class="stat"><b id="started">٠</b>دروس بدأت</div><div class="stat"><b id="completed">٠</b>دروس مكتملة</div><div class="stat"><b id="pct">٠٪</b>نسبة التقدم</div></div></section><section class="card"><h2>🏆 إنجازاتي</h2><div class="badges"><div class="badge" id="badgeNumbers">🔢<br>مستكشف الأعداد<br><small class="muted">ابدأ ٣ دروس</small></div><div class="badge" id="badgeMeasure">📏<br>بطل القياس<br><small class="muted">أكمل درسًا في القياس</small></div><div class="badge" id="badgeThink">🧠<br>عقل متفكر<br><small class="muted">أكمل درسًا كاملًا</small></div></div></section><div class="actions"><button class="btn" onclick="location.href='semester1.html'">🗺️ أعود إلى رحلتي</button><button class="btn primary" onclick="location.href='progress.html'">⭐ أشاهد تقدمي</button></div></div><script>const titles=['١-١ صناعة لوحة المائة','١-٢ العد بالاثنينات والخمسات والعشرات','١-٣ الأزواج العددية حتى ١٠٠','٢-٣ جمع وطرح الأزواج العددية حتى ١٠٠','١-٤ استخدام خط الأعداد','٢-٤ تقريب الأعداد باستخدام خط الأعداد','١-٥ الأزواج العددية لـ٢٠','٢-٥ الأزواج العددية بين ١٠ و٢٠','١-٦ الجمع باستخدام الأزواج العددية','٢-٦ التحقق من الحل','٣-٦ المتساوي والمتكافئ','١-٧ مقدمة حول المصفوفات','١-٨ الأشكال الثنائية الأبعاد','٢-٨ المجسمات','٣-٨ التماثل','١-٩ صناعة علبة','٢-٩ قياس المسافة','٣-٩ صناعة أجسام متحركة','١-١٠ قياس الوقت','٢-١٠ قياس المسافة','٣-١٠ قياس الارتفاع','١-١١ قياس المكونات','٢-١١ وقت الطهي','٣-١١ البسكويت الثمين','١-١٢ العشرات والآحاد حتى ١٠٠','٢-١٢ مقارنة وترتيب الأعداد','١-١٣ التقدير','١-١٤ الأزواج العددية لـ٢٠','٢-١٤ الضعف','٣-١٤ تصنيف الأعداد','١-١٥ الأعداد المكونة من رقم أو رقمين','٢-١٥ الأعداد المكونة من رقمين','١-١٦ العثور على الفرق','١-١٧ المصفوفات','٢-١٧ العد بالاثنينات والخمسات والعشرات','٣-١٧ القسمة'];function ar(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}function calc(){let started=0,completed=0;titles.forEach(t=>{if(Number(localStorage.getItem('uqul_'+t))>0)started++;if(localStorage.getItem('uqul_completed_'+t)==='1')completed++;});let pct=Math.round(completed/titles.length*100);document.getElementById('started').textContent=ar(started);document.getElementById('completed').textContent=ar(completed);document.getElementById('pct').textContent=ar(pct)+'٪';document.getElementById('fill').style.width=pct+'%';document.getElementById('progressText').textContent=completed?`أكملت ${ar(completed)} من ${ar(titles.length)} درسًا في الفصل الأول.`:started?`بدأت ${ar(started)} من ${ar(titles.length)} درسًا — أكمل الأنشطة لتسجل إنجازك.`:'لم تبدأ الرحلة بعد. اختر أول درس وابدأ!'}function saveName(){const n=document.getElementById('name').value.trim();if(n)localStorage.setItem('uqul_studentName',n);showName()}function showName(){const n=localStorage.getItem('uqul_studentName')||'';document.getElementById('name').value=n;document.getElementById('hello').textContent=n?`مرحبًا يا ${n} 🌟`:'مرحبًا أيها المستكشف! 🌟'}function setBadge(id,unlocked,text){const el=document.getElementById(id);if(unlocked){el.style.background='#eaf6ef';el.style.borderColor='#9ac9af';el.innerHTML=text+'<br><small>مفتوحة ✓</small>';}else{el.style.opacity='.58';}}
const completedTitles=titles.filter(t=>localStorage.getItem('uqul_completed_'+t)==='1');
const startedTitles=titles.filter(t=>Number(localStorage.getItem('uqul_'+t))>0);
setBadge('badgeNumbers',startedTitles.length>=3,'🔢<br>مستكشف الأعداد');
setBadge('badgeMeasure',completedTitles.some(t=>/^([١-٣]-٩|[١-٣]-١٠|[١-٣]-١١)/.test(t)),'📏<br>بطل القياس');
setBadge('badgeThink',completedTitles.length>=1,'🧠<br>عقل متفكر');
showName();calc();</script></body></html>
