<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درس الرياضيات | عقول للصف الثاني</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f8f6;color:#17312b}.wrap{max-width:1100px;margin:auto;padding:22px}.top,.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #d8e4de;background:#fff;border-radius:13px;padding:10px 15px;cursor:pointer;font-weight:bold}.primary{background:#2f7d5b;color:#fff}.hero,.card{background:#fff;border:1px solid #dfe9e4;border-radius:24px;padding:24px;margin-top:18px;box-shadow:0 7px 22px #17312b0c}.hero{background:linear-gradient(135deg,#fff,#edf6f1)}.goals,.levels,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.goal,.q{background:#f5f8f6;border-radius:15px;padding:14px}.level{border-top:6px solid #2f7d5b}.advance{border-color:#3976a8}.challenge{border-color:#7655a8}.oman{border-right:6px solid #b4872e;background:#fff9ec}.think{border-right:6px solid #7655a8;background:#f4f0fb}.check{border-right:6px solid #3976a8;background:#eef6fb}.opt{background:#fff;border:1px solid #d7e2dc;border-radius:11px;padding:9px 15px;cursor:pointer;font-weight:bold;margin:4px}.feedback{min-height:25px;font-weight:bold}.chart{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.num{padding:7px;text-align:center;background:#edf3ef;border-radius:8px;font-weight:bold;cursor:pointer}.progress{height:11px;background:#e5eeea;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#2f7d5b;transition:.3s}.badge{display:inline-block;background:#fff4ce;padding:10px 14px;border-radius:13px;font-weight:bold}@media(max-width:750px){.goals,.levels,.grid{grid-template-columns:1fr}.chart{gap:3px}.num{font-size:11px;padding:5px 1px}}</style>

</head><body><div class="site-buddy" aria-hidden="true">🧠<span class="buddy-label">هيا نكتشف! ✨</span></div><div class="wrap"><header class="top"><button class="btn" onclick="location.href='semester1.html'">→ الفصل الدراسي الأول</button><div><b>🧠 عقول للصف الثاني</b><div>رحلتي في عالم الرياضيات</div></div><button class="btn" onclick="document.getElementById('progress').scrollIntoView({behavior:'smooth'})">⭐ تقدمي</button></header><section class="hero"><div style="color:#2f7d5b;font-weight:bold">🌟 بوابة الدرس</div><h1 id="title"></h1><p id="intro"></p><div class="goals" id="goals"></div><button class="btn primary" onclick="document.getElementById('learn').scrollIntoView({behavior:'smooth'})">🚀 أبدأ الرحلة</button></section><section class="card" id="learn"><h2>📚 أتعلم</h2><p id="learnText"></p><div id="learnExample"></div><div id="visual"></div></section><section class="card"><h2>✏️ أتدرب</h2><div class="levels"><article class="card level"><h3>🟢 أبدأ</h3><div id="start"></div></article><article class="card level advance"><h3>🔵 أتقدم</h3><div id="advance"></div></article><article class="card level challenge"><h3>🟣 أتحدى</h3><div id="challenge"></div></article></div></section><section class="card think"><h2>🧠 أفكر</h2><div id="think"></div></section><section class="card oman"><h2>🇴🇲 رياضيات من عُمان</h2><div id="oman"></div></section><section class="card check"><h2>✓ أتحقق من تعلمي</h2><div id="check"></div><div class="feedback" id="checkFeedback"></div></section><section class="card" id="progress"><h2>⭐ تقدمي</h2><div class="progress"><div class="fill" id="fill"></div></div><p id="progressText">ابدأ أنشطة الدرس لترى تقدمك.</p><span class="badge" id="badge">🏅 مستكشف الرياضيات</span><div class="actions" style="margin-top:18px"><button class="btn" onclick="location.reload()">🔁 أعيد التدريب</button><button class="btn primary" onclick="location.href='semester1.html'">🗺️ أعود إلى رحلتي</button></div></section></div><script>const arab=['١','٢','٣','٤','٥','٦','٧','٨','٩','١٠','١١','١٢','١٣','١٤','١٥','١٦','١٧','١٨','١٩','٢٠','٢١','٢٢','٢٣','٢٤','٢٥','٢٦','٢٧','٢٨','٢٩','٣٠','٣١','٣٢','٣٣','٣٤','٣٥','٣٦','٣٧','٣٨','٣٩','٤٠','٤١','٤٢','٤٣','٤٤','٤٥','٤٦','٤٧','٤٨','٤٩','٥٠','٥١','٥٢','٥٣','٥٤','٥٥','٥٦','٥٧','٥٨','٥٩','٦٠','٦١','٦٢','٦٣','٦٤','٦٥','٦٦','٦٧','٦٨','٦٩','٧٠','٧١','٧٢','٧٣','٧٤','٧٥','٧٦','٧٧','٧٨','٧٩','٨٠','٨١','٨٢','٨٣','٨٤','٨٥','٨٦','٨٧','٨٨','٨٩','٩٠','٩١','٩٢','٩٣','٩٤','٩٥','٩٦','٩٧','٩٨','٩٩','١٠٠'];const data={
"١-١ صناعة لوحة المائة":{intro:'اكتشف أسرار الأعداد من ١ إلى ١٠٠.',goals:['أرتب الأعداد من ١ إلى ١٠٠','أكتشف الأنماط','أحل المشكلات'],learn:'عند النزول صفًا واحدًا في العمود نفسه نضيف ١٠.',example:'٢٣ ← ٣٣ ← ٤٣ ← ٥٣',start:[['أكمل: ١، ٢، ⬜، ٤، ٥',['٣','٦'],0]],advance:[['ما العدد أسفل ٢٤؟',['٢٥','٣٤','١٤'],1]],challenge:[['عدد بين ٥٠ و٦٠، إذا نزلنا منه صفًا نصل إلى ٦٧. من هو؟',['٤٧','٥٧','٦٧'],1]],think:[['كان سالم عند ٢٥ وتحرك للأسفل صفين. أين وصل؟',['٣٥','٤٥','٥٥'],1]],oman:[['🌴 مزرعة نخيل: ٥ صفوف، في كل صف ١٠ نخلات. كم نخلة؟',['٤٠','٥٠','٦٠'],1]],check:[['ما العدد بعد ٦٩؟',['٧٠','٦٨'],0],['ما العدد أسفل ٣٢؟',['٤٢','٣٣'],0],['٢٥ ← ٣٥ ← ٤٥ ← ⬜',['٥٥','٥٠'],0]]},
"١-٢ العد بالاثنينات والخمسات والعشرات":{intro:'تعلّم العد بقفزات منتظمة.',goals:['أعد بالاثنينات','أعد بالخمسات','أعد بالعشرات'],learn:'يمكننا العد بقفزات ثابتة بدل عد كل عدد واحدًا واحدًا.',example:'٢، ٤، ٦، ٨، ١٠   |   ٥، ١٠، ١٥، ٢٠   |   ١٠، ٢٠، ٣٠، ٤٠',start:[['أكمل: ٢، ٤، ⬜، ٨',['٦','٧'],0]],advance:[['أكمل: ١٠، ٢٠، ٣٠، ⬜',['٤٠','٣٥'],0]],challenge:[['بدأت عند ١٥ وقفزت بالخمسات ٣ مرات. أين أصل؟',['٢٥','٣٠','٣٥'],2]],think:[['أي نمط أسرع للوصول من ٢٠ إلى ٦٠: بالعشرات أم بالخمسات؟',['بالعشرات','بالخمسات'],0]],oman:[['🐟 في سوق السمك وُضعت الأسماك في مجموعات من ٥. ما العدد بعد ٢٠؟',['٢٥','٢٢','٣٠'],0]],check:[['بعد ٣٠ بالعشرات؟',['٤٠','٣٥'],0],['بعد ٢٥ بالخمسات؟',['٣٠','٢٧'],0],['بعد ٨ بالاثنينات؟',['١٠','٩'],0]]},
"١-٣ الأزواج العددية حتى ١٠٠":{intro:'اكتشف عددين يمكن أن يكون مجموعهما ١٠٠.',goals:['أكوّن أزواجًا للعدد ١٠٠','أستخدم الجمع','أشرح تفكيري'],learn:'كل عدد يمكن أن يكون له عدد مكمل للوصول إلى ١٠٠.',example:'٢٠ + ٨٠ = ١٠٠، ٤٠ + ٦٠ = ١٠٠',start:[['٣٠ + ⬜ = ١٠٠',['٧٠','٦٠'],0]],advance:[['ما مكمل ٤٥ إلى ١٠٠؟',['٥٥','٦٥'],0]],challenge:[['اكتب زوجًا آخر مجموعهما ١٠٠ غير ٤٠ و٦٠.',['٣٠ و٧٠','٣٠ و٦٠'],0]],think:[['كيف تعرف مكمل ٦٢ دون العد واحدًا واحدًا؟',['أطرح ٦٢ من ١٠٠','أضيف ٦٢ إلى ١٠٠'],0]],oman:[['💰 لديك ٤٠ ريالًا وتريد الوصول إلى ١٠٠ ريال. كم تحتاج؟',['٦٠','٥٠','٧٠'],0]],check:[['٢٠ + ⬜ = ١٠٠',['٨٠','٧٠'],0],['مكمل ٧٥؟',['٢٥','٣٥'],0],['٥٠ + ٥٠؟',['١٠٠','٩٠'],0]]}
};
// fallback lessons: same template, customized by title so the whole semester is immediately navigable.
const fallback={intro:'هيا نكتشف مهارة جديدة في الرياضيات.',goals:['أفهم الفكرة الأساسية','أتدرب خطوة بخطوة','أستخدم مهارتي في موقف حياتي'],learn:'اقرأ الفكرة، ثم جرّب الأمثلة قبل الانتقال إلى التدريب.',example:'فكّر، جرّب، ثم تحقّق من إجابتك.',start:[['اختر الإجابة الصحيحة',['أحسنت','حاول مرة أخرى'],0]],advance:[['أي اختيار يوضح فهمك؟',['الاختيار الأول','الاختيار الثاني'],0]],challenge:[['أي إجابة تحتاج إلى تفكير أكثر؟',['الأولى','الثانية'],0]],think:[['ما الاستراتيجية التي ستستخدمها؟',['أشرح طريقتي','أخمن'],0]],oman:[['🇴🇲 كيف يمكن استخدام هذه المهارة في موقف من حياتنا في عُمان؟',['في المدرسة أو المنزل أو السوق','لا يمكن استخدامها'],0]],check:[['هل فهمت الفكرة؟',['نعم','ليس بعد'],0],['هل تستطيع شرحها؟',['نعم','أحتاج تدريبًا'],0],['هل تستطيع استخدامها؟',['نعم','أحتاج مساعدة'],0]]};
const title=new URLSearchParams(location.search).get('lesson')||'١-١ صناعة لوحة المائة';const d=data[title]||fallback;document.getElementById('title').textContent='🔢 '+title;document.getElementById('intro').textContent=d.intro;document.getElementById('goals').innerHTML=d.goals.map(x=>`<div class="goal">🌟 ${x}</div>`).join('');document.getElementById('learnText').textContent=d.learn;document.getElementById('learnExample').innerHTML=`<div class="q"><b>مثال:</b> ${d.example}</div>`;if(title==='١-١ صناعة لوحة المائة'){document.getElementById('visual').innerHTML='<div class="chart">'+arab.map(n=>`<div class="num">${n}</div>`).join('')+'</div>'}function q(block,id){document.getElementById(block).innerHTML=d[block].map((x,i)=>`<div class="q"><b>${x[0]}</b><div>${x[1].map((o,j)=>`<button class="opt" onclick="ans(this,${j===x[2]},'${id+i}')">${o}</button>`).join('')}</div><div class="feedback" id="${id+i}"></div></div>`).join('')}q('start','s');q('advance','a');q('challenge','c');q('think','t');q('oman','o');q('check','f');let score=0,total=d.start.length+d.advance.length+d.challenge.length+d.think.length+d.oman.length+d.check.length;function ans(btn,ok,id){document.querySelectorAll('.opt').forEach(x=>{});btn.style.background=ok?'#dff2e7':'#fde9e7';document.getElementById(id).textContent=ok?'رائع! إجابة صحيحة 🌟':'حاول مرة أخرى 💪';if(ok&&!btn.dataset.counted){btn.dataset.counted='1';score++;update()}}function update(){let p=Math.round(score/total*100);document.getElementById('fill').style.width=p+'%';document.getElementById('progressText').textContent=p===100?'أحسنت! أتقنت الدرس 🎉':`تقدمك الآن ${p}٪ — واصل المحاولة!`;document.getElementById('badge').textContent=p===100?'🏆 خبير الرياضيات':p>=60?'⭐ متقدم في الرحلة':'🏅 مستكشف الرياضيات'}</script></body></html>
