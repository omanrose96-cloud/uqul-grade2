<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقدمي | عقول للصف الثاني</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f8f6;color:#17312b}.p{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:1px solid #d9e5df;background:#fff;border-radius:14px;padding:11px 16px;cursor:pointer;font-weight:700}.hero,.unit{background:#fff;border:1px solid #dce8e2;border-radius:26px;padding:24px;margin-top:18px;box-shadow:0 8px 24px #17312b10}.hero{background:linear-gradient(135deg,#fff,#eaf5ef)}.overall{display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center}.circle{width:150px;height:150px;border-radius:50%;background:#e7f3ec;display:grid;place-items:center;text-align:center;margin:auto}.circle b{font-size:32px;display:block}.progress{height:13px;background:#e4ede8;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#55a67d;width:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lesson{border:1px solid #e0e9e4;border-radius:18px;padding:15px;background:#fbfdfc}.lesson h3{margin:0 0 8px;font-size:17px}.status{display:inline-block;padding:7px 9px;border-radius:10px;font-size:13px}.done{background:#dff3e7}.started{background:#eaf1f8}.none{background:#f0f3f1;color:#687872}.unithead{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#eef6f1;padding:14px 16px;border-radius:16px}.muted{color:#71817b}@media(max-width:700px){.overall{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
<style id="uqul-final-visual">
:root{--uq-ink:#26354a;--uq-muted:#6f7b8c;--uq-bg:#f8f9ff;--uq-card:#ffffff;--uq-mint:#5cc6a5;--uq-sky:#68a9f3;--uq-sun:#ffd66b;--uq-lilac:#a98bea;--uq-coral:#ff8d8d;--uq-border:#e6e8f2;--uq-shadow:0 14px 35px rgba(67,74,105,.10)}

</head><body><div class="site-buddy" aria-hidden="true">🧠<span class="buddy-label">هيا نكتشف! ✨</span></div><div class="p"><header class="top"><button class="btn" onclick="location.href='index.html'">← الرئيسية</button><b>⭐ تقدمي</b><button class="btn" onclick="location.href='profile.html'">👤 ملفي</button></header><section class="hero"><h1>⭐ تقدمي في رحلة الرياضيات</h1><p id="hello" class="muted"></p><div class="overall"><div class="circle"><div><b id="pct">٠٪</b><span>من الرحلة</span></div></div><div><h2>رحلتك خطوة بخطوة</h2><div class="progress"><div class="fill" id="fill"></div></div><p id="summary" class="muted"></p><div><span>🟢 مكتمل</span> &nbsp; <span>🔵 قيد التعلم</span> &nbsp; <span>⚪ لم يبدأ</span></div></div></div></section><main id="units"></main></div><script>const units=[['١أ','العدد وحل المشكلات',[['١-١ صناعة لوحة المائة','أرتب الأعداد وأكتشف الأنماط'],['١-٢ العد بالاثنينات والخمسات والعشرات','أعد مجموعات الأعداد'],['١-٣ الأزواج العددية حتى ١٠٠','أكوّن ١٠٠'],['٢-٣ جمع وطرح الأزواج العددية حتى ١٠٠','أستخدم عائلة الحقائق'],['١-٤ استخدام خط الأعداد','أحدد مكان العدد'],['٢-٤ تقريب الأعداد باستخدام خط الأعداد','أقرّب إلى أقرب ١٠'],['١-٥ الأزواج العددية لـ٢٠','أكوّن ٢٠'],['٢-٥ الأزواج العددية بين ١٠ و٢٠','أحل مسائل بالأزواج'],['١-٦ الجمع باستخدام الأزواج العددية','أجمع باستراتيجيات ذكية'],['٢-٦ التحقق من الحل','أتحقق من إجابتي'],['٣-٦ المتساوي والمتكافئ','أكتشف العبارات المتكافئة'],['١-٧ مقدمة حول المصفوفات','أمثل الصفوف والأعمدة'],['١-٨ الأشكال الثنائية الأبعاد','أصف خصائص الأشكال'],['٢-٨ المجسمات','أتعرف المجسمات'],['٣-٨ التماثل','أكتشف التماثل']]],['١ج','القياس وحل المشكلات',[['١-٩ صناعة علبة','أستخدم القياس في التصميم'],['٢-٩ قياس المسافة','أقيس وأقارن المسافات'],['٣-٩ صناعة أجسام متحركة','أطبق التوازن والقياس'],['١-١٠ قياس الوقت','أقيس مدة الأنشطة'],['٢-١٠ قياس المسافة','أنظم نتائج القياس'],['٣-١٠ قياس الارتفاع','أقيس الارتفاع'],['١-١١ قياس المكونات','أقيس الكتلة'],['٢-١١ وقت الطهي','أستخدم الزمن'],['٣-١١ البسكويت الثمين','أحل مشكلات الإنفاق']]],['٢أ','الأعداد والأنماط والجمع والطرح',[['١-١٢ العشرات والآحاد حتى ١٠٠','أفهم القيمة المكانية'],['٢-١٢ مقارنة وترتيب الأعداد','أقارن وأرتب'],['١-١٣ التقدير','أقدّر الكميات'],['١-١٤ الأزواج العددية لـ٢٠','أكتشف الأنماط'],['٢-١٤ الضعف','أستخدم الضعف'],['٣-١٤ تصنيف الأعداد','أصنف الأعداد'],['١-١٥ الأعداد المكونة من رقم أو رقمين','أستخدم استراتيجية العشرة'],['٢-١٥ الأعداد المكونة من رقمين','أجزئ العشرات والآحاد'],['١-١٦ العثور على الفرق','أجد الفرق'],['١-١٧ المصفوفات','أكوّن مصفوفات'],['٢-١٧ العد بالاثنينات والخمسات والعشرات','أعد بطرائق مناسبة'],['٣-١٧ القسمة','أشارك بالتساوي']]]];function ar(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}function status(t){const s=Number(localStorage.getItem('uqul_'+t));const done=localStorage.getItem('uqul_completed_'+t)==='1';return done?['🟢 مكتمل','done']:s>0?['🔵 قيد التعلم','started']:['⚪ لم يبدأ','none']}let all=units.flatMap(u=>u[2]);let started=all.filter(x=>Number(localStorage.getItem('uqul_'+x[0]))>0).length;let completed=all.filter(x=>localStorage.getItem('uqul_completed_'+x[0])==='1').length;let pct=Math.round(completed/all.length*100);document.getElementById('pct').textContent=ar(pct)+'٪';document.getElementById('fill').style.width=pct+'%';document.getElementById('summary').textContent=completed?`أكملت ${ar(completed)} من ${ar(all.length)} درسًا • لديك ${ar(started-completed)} درسًا قيد التعلم.`:`بدأت ${ar(started)} من ${ar(all.length)} درسًا • أكمل الأنشطة لتسجل إنجازك.`;const name=localStorage.getItem('uqul_studentName');document.getElementById('hello').textContent=name?`أهلًا ${name} 🌟 — شاهد أين وصلت في رحلتك.`:'يمكنك كتابة اسمك من «ملفي» ليظهر هنا.';document.getElementById('units').innerHTML=units.map(u=>`<section class="unit"><div class="unithead"><b>${u[0]} — ${u[1]}</b><span class="muted">${ar(u[2].filter(x=>localStorage.getItem('uqul_completed_'+x[0])==='1').length)} / ${ar(u[2].length)} مكتمل</span></div><div class="grid" style="margin-top:12px">${u[2].map(x=>{const st=status(x[0]);return `<article class="lesson"><h3>${x[0]}</h3><div class="muted">${x[1]}</div><span class="status ${st[1]}">${st[0]}</span><br><button class="btn" style="margin-top:10px" onclick="location.href='lesson.html?lesson='+encodeURIComponent('${x[0]}')">افتح الدرس ←</button></article>`}).join('')}</div></section>`).join('');</script></body></html>
